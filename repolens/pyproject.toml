[project]
name = "repolens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23,<1",
    "tree-sitter-language-pack>=0.3,<1",
    "networkx>=3.3,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "lancedb>=0.12,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "mcp>=1.0,<2",
    "fastmcp>=3.4,<4",
    "apscheduler>=3.10,<4",
    "watchdog>=4,<7",
    "structlog>=24,<25",
    "click>=8.1,<9",
    "rich>=13,<14",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "gitpython>=3.1,<4",
    "jinja2>=3.1,<4",
    "pathspec>=0.12,<1",
    "tenacity>=9,<10",
    "pyyaml>=6.0,<7",
    "scipy>=1.11,<2",
    "filelock>=3.15,<4",
    "pyzmq>=26,<28"
]

[project.optional-dependencies]
postgres = ["pgvector>=0.3", "asyncpg>=0.29"]
communities = ["graspologic>=3.4"]
embeddings = ["sentence-transformers>=3.0"]
metrics = ["prometheus-client>=0.20"]

[project.scripts]
repolens = "repolens.cli.main:cli"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["repolens*"]

[tool.setuptools.package-data]
repolens = ["../templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
